<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    {% block meta %}{% endblock %}
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{ app_version | urlencode }}" />
    <script src="/static/js/common.js?v={{ app_version | urlencode }}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body{% block body_attrs %}{% endblock %}>
    {% block content %}{% endblock %}
  </body>
</html>
